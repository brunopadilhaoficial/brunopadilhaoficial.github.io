<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG Commander Tracker: Classic Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f13;
            --card-bg: #1a1a21;
            --gold: #cba35e;
            --gold-dim: #8a6e3e;
            --blood: #cf3434;
            --life: #4caf50;
            --mana-blue: #2980b9;
            --text-main: #ecf0f1;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: 'Cinzel', serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Overlay de Inicio (Para ativar som) --- */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        .btn-start {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 20px 40px;
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(203, 163, 94, 0.2);
        }
        .btn-start:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px rgba(203, 163, 94, 0.6);
        }

        /* --- Layout do Jogo --- */
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 1.2rem; letter-spacing: 2px; color: var(--gold); }
        .reset-icon { cursor: pointer; font-size: 1.5rem; transition: transform 0.3s; }
        .reset-icon:hover { transform: rotate(180deg); color: var(--blood); }

        .game-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* --- Player Card Design --- */
        .player-column {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            transition: background 0.2s;
            overflow: hidden;
        }
        .player-column:last-child { border-right: none; }

        /* Imagem de Fundo do Avatar */
        .player-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            z-index: 0;
            transition: transform 0.5s, opacity 0.3s;
            filter: grayscale(40%);
        }
        
        /* Efeito de Dano (Flash Vermelho) */
        .damage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(200, 0, 0, 0.8) 100%);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        /* Conteúdo do Card */
        .player-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.8) 100%);
        }

        /* Nome Editável */
        .player-name {
            background: transparent;
            border: none;
            color: #ccc;
            font-family: 'MedievalSharp', cursive;
            font-size: 1.5rem;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px #000;
            outline: none;
            margin-bottom: 10px;
        }
        .player-name:focus { color: var(--gold); }

        /* Contador de Vida */
        .life-display {
            font-size: 7rem;
            font-weight: 700;
            margin: 10px 0;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
            cursor: pointer; /* Área de toque para "Undo" futuramente, ou apenas visual */
        }

        /* Botões de Controle (Estilo Magic) */
        .controls {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-life {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-minus:active { background: rgba(207, 52, 52, 0.6); border-color: var(--blood); transform: scale(0.95); }
        .btn-plus:active { background: rgba(76, 175, 80, 0.6); border-color: var(--life); transform: scale(0.95); }
        
        .btn-life:hover { border-color: var(--gold); }

        /* Animações CSS */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking { animation: shake 0.4s; color: var(--blood); }
        .healing { color: var(--life); text-shadow: 0 0 20px var(--life); transition: color 0.3s; }

        /* Responsividade Mobile */
        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            .player-column { border-right: none; border-bottom: 1px solid #333; flex: 1; }
            .player-bg { background-position: top center; }
            .life-display { font-size: 5rem; margin: 0; }
            .btn-life { width: 50px; height: 50px; font-size: 1.5rem; }
            .player-name { font-size: 1.2rem; margin-bottom: 5px; }
            .controls { margin-top: 5px; }
        }

    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: var(--gold); text-shadow: 0 0 10px rgba(0,0,0,0.8); margin-bottom: 40px;">Magic: The Gathering</h1>
        <button class="btn-start" onclick="startGame()">Iniciar Partida</button>
    </div>

    <header>
        <div class="header-title">Battle Tracker</div>
        <div class="reset-icon" onclick="resetGame()" title="Reiniciar Jogo">↻</div>
    </header>

    <div class="game-container">
        
        <div class="player-column" id="p1">
            <div class="player-bg" style="background-image: url('https://wizards.com/contentimages/magic/daily/wallpapers/Gideon_Jura_1280x960_Wallpaper.jpg');"></div>
            <div class="damage-overlay" id="p1-dmg-overlay"></div>
            <div class="player-content">
                <input type="text" class="player-name" value="Planeswalker 1">
                <div class="life-display" id="p1-score">20</div>
                <div class="controls">
                    <button class="btn-life btn-minus" onclick="changeLife(1, -1)">-</button>
                    <button class="btn-life btn-plus" onclick="changeLife(1, 1)">+</button>
                </div>
            </div>
        </div>

        <div class="player-column" id="p2">
            <div class="player-bg" style="background-image: url('https://media.wizards.com/images/magic/daily/wallpapers/Liliana_Vess_1280x960_Wallpaper.jpg');"></div>
            <div class="damage-overlay" id="p2-dmg-overlay"></div>
            <div class="player-content">
                <input type="text" class="player-name" value="Planeswalker 2">
                <div class="life-display" id="p2-score">20</div>
                <div class="controls">
                    <button class="btn-life btn-minus" onclick="changeLife(2, -1)">-</button>
                    <button class="btn-life btn-plus" onclick="changeLife(2, 1)">+</button>
                </div>
            </div>
        </div>

        <div class="player-column" id="p3">
            <div class="player-bg" style="background-image: url('https://media.wizards.com/images/magic/daily/wallpapers/Chandra_Nalaar_1280x960_Wallpaper.jpg');"></div>
            <div class="damage-overlay" id="p3-dmg-overlay"></div>
            <div class="player-content">
                <input type="text" class="player-name" value="Planeswalker 3">
                <div class="life-display" id="p3-score">20</div>
                <div class="controls">
                    <button class="btn-life btn-minus" onclick="changeLife(3, -1)">-</button>
                    <button class="btn-life btn-plus" onclick="changeLife(3, 1)">+</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Gerenciamento de Audio ---
        // Usando sons curtos e responsivos via CDN (Mixkit)
        const sounds = {
            hit: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-hard-sword-woosh-1485.mp3'),
            heavyHit: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-dagger-woosh-1487.mp3'),
            heal: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-fairy-glitter-867.mp3'),
            start: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-medieval-show-fanfare-announcement-226.mp3')
        };

        // Pré-carregar e ajustar volumes
        Object.values(sounds).forEach(s => s.volume = 0.4);
        sounds.start.volume = 0.2;

        let gameStarted = false;

        function startGame() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-overlay').style.display = 'none';
            }, 500);
            
            sounds.start.play().catch(e => console.log("Erro audio:", e));
            gameStarted = true;
        }

        function playSound(type) {
            if(!gameStarted) return;
            // Clone node permite tocar o mesmo som sobreposto (rapid fire)
            const s = sounds[type].cloneNode();
            s.volume = sounds[type].volume;
            s.play();
        }

        // --- Lógica do Jogo ---
        const scores = { 1: 20, 2: 20, 3: 20 };

        function changeLife(player, amount) {
            scores[player] += amount;
            
            // Elementos DOM
            const display = document.getElementById(`p${player}-score`);
            const card = document.getElementById(`p${player}`);
            const damageOverlay = document.getElementById(`p${player}-dmg-overlay`);
            const bg = card.querySelector('.player-bg');

            // Atualiza Texto
            display.innerText = scores[player];

            // Feedback Visual e Sonoro
            display.classList.remove('shaking', 'healing');
            void display.offsetWidth; // Trigger reflow para reiniciar animação

            if (amount < 0) {
                // DANO
                playSound(amount < -2 ? 'heavyHit' : 'hit');
                display.classList.add('shaking');
                
                // Flash de sangue
                damageOverlay.style.opacity = '1';
                setTimeout(() => damageOverlay.style.opacity = '0', 200);

                // Zoom in no background (efeito de tensão)
                bg.style.transform = "scale(1.1)";
                setTimeout(() => bg.style.transform = "scale(1)", 200);

            } else {
                // CURA
                playSound('heal');
                display.classList.add('healing');
                setTimeout(() => display.classList.remove('healing'), 500);
            }

            // Morte visual
            if (scores[player] <= 0) {
                card.style.filter = "grayscale(100%) brightness(0.5)";
                display.style.textDecoration = "line-through";
                display.style.color = "#666";
            } else {
                card.style.filter = "none";
                display.style.textDecoration = "none";
                display.style.color = "var(--text-main)";
            }
        }

        function resetGame() {
            if(confirm("Reiniciar duelo?")) {
                [1,2,3].forEach(id => {
                    scores[id] = 20;
                    const display = document.getElementById(`p${id}-score`);
                    const card = document.getElementById(`p${id}`);
                    
                    display.innerText = 20;
                    display.classList.remove('shaking', 'healing');
                    
                    card.style.filter = "none";
                    display.style.textDecoration = "none";
                    display.style.color = "var(--text-main)";
                    
                    // Pequena animação de reset
                    changeLife(id, 0); 
                });
                sounds.start.play();
            }
        }
    </script>
</body>
</html>
