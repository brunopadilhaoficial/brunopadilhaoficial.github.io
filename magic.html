<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador MTG - 3 Jogadores</title>
    <style>
        /* Estilos Gerais (Dark Mode para economizar bateria e conforto visual) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 10px;
            background-color: #252525;
            border-bottom: 2px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #ccc;
        }

        /* Container Principal - Layout de 3 Colunas */
        .game-board {
            display: flex;
            flex: 1; /* Ocupa o resto da altura da tela */
            flex-direction: row;
            justify-content: space-around;
            align-items: stretch;
            padding: 10px;
            gap: 10px;
        }

        /* Cartão do Jogador */
        .player-card {
            background-color: #2a2a2a;
            border-radius: 12px;
            flex: 1; /* Cada jogador ocupa espaço igual */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
            transition: border-color 0.3s;
        }

        /* Input para o Nome do Jogador */
        .player-name {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            width: 90%;
            margin-bottom: 20px;
            padding: 5px;
            outline: none;
        }

        .player-name:focus {
            border-bottom: 1px solid #9b59b6;
        }

        /* Display de Vida */
        .life-total {
            font-size: 5rem;
            font-weight: bold;
            margin: 10px 0;
            user-select: none; /* Evita selecionar o texto ao clicar rápido */
        }

        /* Cores baseadas na vida (Opcional, mas visualmente útil) */
        .life-high { color: #2ecc71; }
        .life-mid { color: #f1c40f; }
        .life-low { color: #e74c3c; }
        .life-dead { color: #7f8c8d; text-decoration: line-through; }

        /* Botões de Controle */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-minus {
            background-color: #c0392b;
            color: white;
        }
        .btn-minus:hover { background-color: #e74c3c; }

        .btn-plus {
            background-color: #27ae60;
            color: white;
        }
        .btn-plus:hover { background-color: #2ecc71; }

        /* Botão de Reset */
        .reset-container {
            padding: 20px;
            text-align: center;
            background-color: #252525;
        }

        .btn-reset {
            background-color: #333;
            color: #aaa;
            padding: 10px 20px;
            width: auto;
            height: auto;
            font-size: 0.9rem;
        }
        .btn-reset:hover { background-color: #444; color: white; }

        /* Responsividade para Celulares (Empilha em vez de colunas) */
        @media (max-width: 768px) {
            .game-board {
                flex-direction: column;
            }
            .player-card {
                flex-direction: row; /* No mobile, layout horizontal por jogador */
                justify-content: space-between;
                padding: 10px 20px;
            }
            .life-total {
                font-size: 3rem;
                margin: 0 15px;
            }
            .player-name {
                width: 30%;
                margin-bottom: 0;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Contador de Vida - Magic: The Gathering</h1>
    </header>

    <div class="game-board">
        <div class="player-card" id="p1-card">
            <input type="text" class="player-name" placeholder="Jogador 1">
            <div class="life-total life-high" id="p1-life">20</div>
            <div class="controls">
                <button class="btn-minus" onclick="updateLife(1, -1)">-</button>
                <button class="btn-plus" onclick="updateLife(1, 1)">+</button>
            </div>
        </div>

        <div class="player-card" id="p2-card">
            <input type="text" class="player-name" placeholder="Jogador 2">
            <div class="life-total life-high" id="p2-life">20</div>
            <div class="controls">
                <button class="btn-minus" onclick="updateLife(2, -1)">-</button>
                <button class="btn-plus" onclick="updateLife(2, 1)">+</button>
            </div>
        </div>

        <div class="player-card" id="p3-card">
            <input type="text" class="player-name" placeholder="Jogador 3">
            <div class="life-total life-high" id="p3-life">20</div>
            <div class="controls">
                <button class="btn-minus" onclick="updateLife(3, -1)">-</button>
                <button class="btn-plus" onclick="updateLife(3, 1)">+</button>
            </div>
        </div>
    </div>

    <div class="reset-container">
        <button class="btn-reset" onclick="resetGame()">Reiniciar Jogo (20)</button>
    </div>

    <script>
        // Estado inicial
        const initialLife = 20;
        let scores = {
            1: initialLife,
            2: initialLife,
            3: initialLife
        };

        function updateLife(playerNum, change) {
            // Atualiza a variável de estado
            scores[playerNum] += change;

            // Seleciona o elemento HTML
            const display = document.getElementById(`p${playerNum}-life`);
            const currentLife = scores[playerNum];

            // Atualiza o texto
            display.innerText = currentLife;

            // Atualiza a cor baseado na vida restante
            updateColor(display, currentLife);
        }

        function updateColor(element, life) {
            // Remove classes antigas
            element.classList.remove('life-high', 'life-mid', 'life-low', 'life-dead');

            // Adiciona a classe correta
            if (life <= 0) {
                element.classList.add('life-dead');
            } else if (life <= 5) {
                element.classList.add('life-low');
            } else if (life <= 10) {
                element.classList.add('life-mid');
            } else {
                element.classList.add('life-high');
            }
        }

        function resetGame() {
            if(confirm("Tem certeza que deseja reiniciar as vidas para 20?")) {
                [1, 2, 3].forEach(num => {
                    scores[num] = initialLife;
                    const display = document.getElementById(`p${num}-life`);
                    display.innerText = initialLife;
                    updateColor(display, initialLife);
                });
            }
        }
    </script>
</body>
</html>
