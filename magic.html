<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ARCADE MTG TRACKER</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --p1-color: #00d2ff; /* Cyan */
            --p2-color: #ff2a6d; /* Neon Red */
            --p3-color: #05ffa1; /* Neon Green */
            --bg-color: #101010;
            --danger-color: #ff0000;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* No text selection */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Black Ops One', cursive;
            overflow: hidden; /* No scrolling */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- START SCREEN (Required for Audio) --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .insert-coin {
            font-family: 'Press Start 2P', cursive;
            font-size: 2vw;
            animation: blink 1s infinite;
            color: yellow;
            margin-top: 20px;
        }

        /* --- MAIN LAYOUT --- */
        .arena {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Portrait Mode (Stack vertically) */
        @media (orientation: portrait) {
            .arena { flex-direction: column; }
        }

        /* --- PLAYER CARD --- */
        .player-zone {
            flex: 1;
            position: relative;
            border: 4px solid #222;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
        }

        /* Distinct Colors */
        #p1 { border-color: var(--p1-color); box-shadow: inset 0 0 20px rgba(0, 210, 255, 0.1); }
        #p2 { border-color: var(--p2-color); box-shadow: inset 0 0 20px rgba(255, 42, 109, 0.1); }
        #p3 { border-color: var(--p3-color); box-shadow: inset 0 0 20px rgba(5, 255, 161, 0.1); }

        /* Dead State */
        .dead {
            filter: grayscale(100%) brightness(0.3);
            pointer-events: none;
        }

        /* Background Health Bar */
        .health-bar-bg {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 0%; /* Grows up */
            opacity: 0.2;
            z-index: 0;
            transition: height 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #p1 .health-bar-bg { background-color: var(--p1-color); }
        #p2 .health-bar-bg { background-color: var(--p2-color); }
        #p3 .health-bar-bg { background-color: var(--p3-color); }

        /* UI Elements */
        .player-name {
            z-index: 2;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .life-counter {
            z-index: 2;
            font-size: 12rem; /* Massive Font */
            line-height: 1;
            text-shadow: 4px 4px 0px #000;
            position: relative;
        }

        /* --- TOUCH ZONES (Invisible Buttons) --- */
        .touch-zone {
            position: absolute;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* Hidden until pressed */
            transition: opacity 0.1s;
            font-size: 5rem;
            font-weight: bold;
            color: white;
            background: rgba(255,255,255,0.1);
        }
        
        .zone-left { left: 0; }
        .zone-left:active { opacity: 1; background: rgba(255, 0, 0, 0.3); } /* Red flash on tap */
        .zone-left::after { content: "-"; }

        .zone-right { right: 0; }
        .zone-right:active { opacity: 1; background: rgba(255, 255, 255, 0.3); } /* White flash on tap */
        .zone-right::after { content: "+"; }


        /* --- ANIMATIONS --- */
        
        /* Floating Combat Text */
        .floating-text {
            position: absolute;
            color: #fff;
            font-size: 4rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 20;
            text-shadow: 2px 2px 0 #000;
            animation: floatUp 0.8s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .dmg-text { color: #ff2a6d; }
        .heal-text { color: #05ffa1; }

        /* Screen Shake */
        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* --- RESET BUTTON --- */
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #333;
            border: 2px solid white;
            color: white;
            border-radius: 50%;
            z-index: 100;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.5;
        }
        .reset-btn:active { transform: scale(0.9); opacity: 1; }

        /* Responsive Text Sizing */
        @media (max-width: 1024px) {
            .life-counter { font-size: 8rem; }
        }
        @media (max-width: 768px) {
            .life-counter { font-size: 6rem; }
            .player-name { font-size: 0.8rem; }
        }

    </style>
</head>
<body>

    <div id="start-screen" onclick="initGame()">
        <h1 style="font-size: 4rem; color: #fff; text-align: center; margin:0; text-shadow: 4px 4px var(--p2-color);">BATTLE MODE</h1>
        <div class="insert-coin">TAP TO START</div>
    </div>

    <div class="arena">
        
        <div class="player-zone" id="p1">
            <div class="health-bar-bg" id="p1-bar" style="height: 100%"></div>
            <div class="touch-zone zone-left" onpointerdown="modifyLife(1, -1, event)"></div>
            <div class="touch-zone zone-right" onpointerdown="modifyLife(1, 1, event)"></div>
            
            <input class="player-name" value="PLAYER 1">
            <div class="life-counter" id="p1-score">20</div>
        </div>

        <div class="player-zone" id="p2">
            <div class="health-bar-bg" id="p2-bar" style="height: 100%"></div>
            <div class="touch-zone zone-left" onpointerdown="modifyLife(2, -1, event)"></div>
            <div class="touch-zone zone-right" onpointerdown="modifyLife(2, 1, event)"></div>

            <input class="player-name" value="PLAYER 2">
            <div class="life-counter" id="p2-score">20</div>
        </div>

        <div class="player-zone" id="p3">
            <div class="health-bar-bg" id="p3-bar" style="height: 100%"></div>
            <div class="touch-zone zone-left" onpointerdown="modifyLife(3, -1, event)"></div>
            <div class="touch-zone zone-right" onpointerdown="modifyLife(3, 1, event)"></div>

            <input class="player-name" value="PLAYER 3">
            <div class="life-counter" id="p3-score">20</div>
        </div>

    </div>

    <div class="reset-btn" onclick="resetGame()">R</div>

    <script>
        // --- AUDIO ENGINE (Arcade Synthesis) ---
        // Using Oscillator nodes so we don't rely on external MP3s loading slowly
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // Arcade envelope (quick attack/decay)
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playDamageSound() {
            // Retro "Hit" sound (Sawtooth drop)
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playHealSound() {
            // Retro "Coin/Powerup" sound (Two sine waves)
            playTone(880, 'sine', 0.1);
            setTimeout(() => playTone(1320, 'sine', 0.2), 100);
        }

        // --- GAME LOGIC ---
        
        let scores = { 1: 20, 2: 20, 3: 20 };
        const maxLife = 40; // Reference for health bar height

        function initGame() {
            initAudio();
            // Play Start Sound
            playTone(440, 'square', 0.1);
            setTimeout(() => playTone(554, 'square', 0.1), 100);
            setTimeout(() => playTone(659, 'square', 0.2), 200);

            const screen = document.getElementById('start-screen');
            screen.style.opacity = 0;
            setTimeout(() => screen.remove(), 500);
        }

        function modifyLife(id, amount, event) {
            if(event) event.stopPropagation(); // Prevent zooming or ghost clicks

            // Update Score
            scores[id] += amount;
            const elScore = document.getElementById(`p${id}-score`);
            const elZone = document.getElementById(`p${id}`);
            const elBar = document.getElementById(`p${id}-bar`);

            elScore.innerText = scores[id];

            // Update Health Bar Height
            // Cap at 100%, Min 0%
            let percentage = (scores[id] / 20) * 50; // Visual logic: 20 life = 50% full (room for overheal)
            if (percentage > 100) percentage = 100;
            if (percentage < 0) percentage = 0;
            elBar.style.height = `${percentage}%`;

            // Visual Effects
            if (amount < 0) {
                playDamageSound();
                elZone.classList.add('shake');
                elScore.style.color = '#ff4d4d'; // Flash Red
                setTimeout(() => elScore.style.color = 'white', 200);
                setTimeout(() => elZone.classList.remove('shake'), 300);
                spawnFloatingText(event.clientX, event.clientY, amount);
            } else {
                playHealSound();
                elScore.style.color = '#05ffa1'; // Flash Green
                setTimeout(() => elScore.style.color = 'white', 200);
                spawnFloatingText(event.clientX, event.clientY, "+" + amount);
            }

            // Death Check
            if (scores[id] <= 0) {
                elZone.classList.add('dead');
                elScore.innerText = "K.O.";
            } else {
                elZone.classList.remove('dead');
            }
        }

        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            
            // Color based on damage/heal
            if (text.toString().includes("-")) el.classList.add('dmg-text');
            else el.classList.add('heal-text');

            // Position adjustment (center on touch)
            // If event is missing (reset), default to center
            if (!x) { x = window.innerWidth/2; y = window.innerHeight/2; }
            
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 50) + 'px';
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function resetGame() {
            if(confirm("RESET GAME?")) {
                [1,2,3].forEach(id => {
                    scores[id] = 20;
                    document.getElementById(`p${id}-score`).innerText = 20;
                    document.getElementById(`p${id}`).classList.remove('dead');
                    document.getElementById(`p${id}-bar`).style.height = '50%';
                });
                playTone(440, 'triangle', 0.5);
            }
        }
    </script>
</body>
</html>
