 ainda tô de luto pelo último jogo. Pênalti aos 48, mano. QUARENTA E OITO.","Domingo eu jogo de ponta. Na minha cabeça eu sou o Garrincha. Na quadra eu sou o Leo."],comida:["Já comeu a coxinha do Café Ipê? Não? Então você não mora aqui ainda, só dorme aqui.","Coxinha da padaria da esquina às duas da manhã. Experiência espiritual."]},topic_dislike:"Livro? Cara, o último livro que eu li tinha figura. E era sobre um cachorro.",topic_neutral:["Hm, é... faz sentido.","Massa. Nunca tinha pensado nisso.","Saquei. Interessante, mano.","Pô, nunca parei pra pensar nisso não.","Ah, legal, legal. Mas e as festas?","Interessante, mano. Muito interessante. Sério.","Saquei. Saquei total."],joke_ok:["HAHAHA! Para, mano! Essa vou roubar.","Kkkkk sério, você é bom nisso. Rafa tem que ouvir essa.","Kkkkkkk mano, para, eu tô chorando!","Para, para, para! Kkkk, vou contar isso no grupo.","KKKKKKK mano, para! Vou contar isso na porta do evento!","Essa foi muito boa! Tu devia fazer stand-up. Eu promovo!","Hahaha! Tô chorando, mano. Chorando."],joke_fail:["...Essa foi de tiozão, hein. Mas eu respeito a coragem.","Hm. Acho que eu não entendi. Ou entendi e não teve graça.","Mano... vou fingir que foi boa porque te considero.","...Mano. Não. Eu te amo, mas não.","Essa aí morreu na fila da porta."],compliment_ok:["Pô, valeu! Você também tá de parabéns, viu.","Para que eu fico sem graça! Valeu, de verdade.","Ó, assim você me deixa todo bobo, hein!","Pô, valeu! Tu sabe elogiar!","Para que eu fico convencido. Mais convencido."],compliment_fail:["Hã... valeu? Tá tudo bem contigo?"],personal:[["Eu? Trabalho com eventos. Conheço todo mundo, mas... sabe como é. Conhecer todo mundo não é a mesma coisa que ter amigo de verdade."],["Posso te contar uma parada? Tem uma mina na academia, a Camila. Eu travo completamente perto dela. Eu! O cara que fala com todo mundo.","Se um dia eu tiver coragem... sei lá. Fica entre nós, beleza?"],["A Isabella vai fazer uma festa sábado aqui no Rafa. Só com convite. Eu tô cuidando da lista.","Vou ser sincero: eu levo quem eu considero amigo. Ainda tô te conhecendo, mas tô gostando."]],personal_fail:["Ih, papo sério logo cedo? Calma, que eu nem tomei café direito."],story_ok:["Mentira que isso aconteceu! Conta de novo a parte do ônibus!","MANO. Isso é história de festa! Conta de novo semana que vem!","Caraca, que história! Isso dava um evento temático."],story_fail:["Essa história tem fim? Tô brincando... mais ou menos.","Mano... onde ia dar essa história? Me perdi no meio."],flirt_deflect:["Kkkkk que isso, {nome}? Guarda esse charme pra quem precisa, mano!"],repeat:["Você já falou isso, cara. Tá tudo bem?"],free_other:["Kkk, como assim?","Ah, mano, tu é engraçado.","Sei não, mas gostei da energia.","Kkkk, tu é doido, mano.","Hã? Fala de novo que eu tava olhando o celular.","Pode crer!","Mano, tu é uma figura.","Isso aí! Bora!"],memory:{joke_ok:"Ainda tô rindo daquela sua piada, mano.",joke_fail:"Já pensou em mais alguma piada? Tô com medo.",lent_money:"Ô, aquela grana que você me emprestou... vou devolver, palavra de Leo!",helped_rafa:"O Rafa não para de falar que você salvou o bar. Moral, hein!",gossip_good:"O pessoal tá falando bem de você por aí, sabia?",gossip_bad:"Ouvi umas coisas sobre você... mas eu não acredito em fofoca. Muito."},greet_place:{"cafe:0":["Bom dia, {nome}! Já pediu a coxinha? É a melhor do mundo, ponto."],"bar:2":["Aí sim! Sexta à noite no Rafa, como manda o figurino!","Chega, {nome}! O chopp tá trincando hoje."],"exterior:1":["Ó o {nome} passeando! Vida boa, hein?"],"bar:1":["Ajudando o Rafa a montar a parada. Vai ser histórico!"]},outfit_like:["Ó o estilo! Essa {item} ficou braba em você, mano."],outfit_dislike:["Que {item} é essa, mano? Kkkk, tô zoando. Mais ou menos."],tired:["Mano, tu tá com uma cara de quem não dorme desde 2019. Tá tudo bem?"],tipsy:["Kkkkk o {nome} tá alegrinho! Vai com calma, guerreiro."],memory_topic:["Fiquei pensando naquele papo de {topic}. Tu manja, hein."],memory_joke:['Mano, aqu !".',"No Ginásio Rocha, o Técnico Rocha treina campeões há trinta anos. O selo dele, dizem, se ganha no grito."]},{id:"b5",name:"Alto da Colina",leader:"lider_rafael",seal:"Selo Musa",sealDesc:"Seu charme dura mais.",attr:"flirting",hint:"O Rafael Lune é romântico: Flerte e Carisma funcionam. Mas quando o gelo cai pela metade, ele entra em crise e vira exigente.",ride:"O ônibus sobe gemendo. Lá em cima, a cidade inteira aparece pela janela, e por um segundo ninguém fala nada.",arrive:["Alto da Colina. Ladeiras de pedra, ipês cor-de-rosa e um artista em cada esquina.","No Ateliê Lune, o pintor Rafael Lune recebe visitas como quem recebe musas. Ou críticos. Depende do humor dele."]},{id:"b6",name:"Distrito Neon",leader:"lider_pixel",seal:"Selo Pixel",sealDesc:"Celular dos outros te atrapalha menos.",attr:"charisma",hint:"A Pixel é tímida: Carisma é super efetivo. Mas na metade ela liga a live, vira festeira, e o chat dá energia pra ela.",ride:"O ônibus atravessa um túnel e sai num mundo de letreiros piscando. São três da tarde, mas parece meia-noite.",arrive:["Distrito Neon. Fliperama, pastel 24 horas e mais luz que o Natal.",'No Fliperama Pixel, a streamer Yumi "Pixel" Takeda transmite pra milhares todo dia. Ao vivo ela é imbatível. Fora da live, dizem, mal fala.']},{id:"b7",name:"Alameda dos Ipês",leader:"lider_odete",seal:"Selo Ouro",sealDesc:"Gente exigente te dá mais crédito.",attr:"charisma",hint:"A Madame Odete é exigente: Carreira é super efetiva. Flerte não funciona, e ela se recompõe rápido.",ride:"O ônibus executivo tem ar-condicionado, poltrona de couro e um silêncio caro. Você fala baixo sem perceber.",arrive:["Alameda dos Ipês. Calçada de mármore, ipês amarelos e carros que não fazem barulho.","Na Galeria Valverde, a crítica Madame Odete decide o que é bom gosto na cidade. O selo dela é o mais difícil de conseguir. Dizem."]},{id:"b8",name:"Distrito Financeiro",leader:"lider_salgado",seal:"Selo Capital",sealDesc:"Você negocia de igual pra igual.",attr:"career",hint:"O Vítor Salgado é exigente: Carreira funciona. Quando a areia do relógio acaba, ele vira ranzinza. Encurralado, não para de falar.",ride:"Ternos, gravatas, celulares. O ônibus inteiro está em reunião, ninguém com ninguém.",arrive:["Distrito Financeiro. Vidro, aço e pressa.","No quadragésimo andar da Torre Salgado, o presidente Vítor Salgado recebe quem tiver coragem de tomar o tempo dele."]},{id:"b9",name:"Centro",leader:"",seal:"",sealDesc:"",attr:"confidence",hint:"A Cobertura: quatro Elites e o Ícone, um depois do outro, sem descanso. Leve coisas pra comer.",ride:"O ônibus circular contorna a praça. Lá no alto, o Edifício Topo pisca uma luz vermelha, como se te esperasse.",arrive:["Centro. O coração da cidade: a praça, o chafariz, a banca e o Edifício Topo.","Lá em cima, na Cobertura, acontece a festa que todo mundo da cidade quer frequentar. Hoje, ela é sua. Se você aguentar."]}],_i=Object.fromEntries(Ga.map(e=>[e.id,e])),ts={lider_hilda:{id:"lider_hilda",region:"b1",type:"ranzinza",level:2,gelo:96,likes:["livros","comida"],dislikes:["festas","moda"],boss:{regen:3,regenLine:"A Dona Hilda rega uma samambaia no meio da sua frase e se acalma.",resist:"flirting",resistLine:'A Dona Hilda te olha por cima dos óculos. "Flerte? Comigo? Na minha estufa?"'},moves:{ignorar:3,teste:3,silencio:2,zoeira:1},lines:{intro:"Fala, então. Mas fala direito, que eu não tenho paciência pra gente que gagueja.",win:'Ela tira os óculos devagar. "Hm. Você tem raiz."',lose:'"Volta quando souber falar sem tremer, menino."',moves:{ignorar:["(Ela continua podando um bonsai, de costas pra você.)",'"Hm." (Só isso. Só "hm".)'],teste:['"Você sabe o nome dessa planta? Não? E quer um selo meu?"','"Me diz uma coisa que você fez sozinho. Sem ajuda."'],zoeira:['"Esse seu cabelo parece uma samambaia mal cuidada."'],silencio:["(Ela te encara em silêncio. O relógio da estufa faz tic. Tac.)"]}},hello:["Mais um querendo selo. Todo ano aparece um.","Sabe por que eu sou anfitriã desse bairro há vinte anos? Porque eu não dou o selo pra qualquer um.","Se você quer o Selo Raiz, vai ter que me convencer. E eu não me convenço fácil."],ready:"Quer tentar agora?",winTalk:["...Tá bom. Toma. O Selo Raiz.","Não fica se achando. Raiz é o começo. Ainda falta o resto da planta.","Agora some daqui, que eu tenho que regar as orquídeas."],loseTalk:"Raiz fraca não segura vento. Volta quando estiver firme.",after:["Ainda aqui? Vai pros Arcos. A Faísca vai gostar de você. Ela gosta de todo mundo. É irritante.","Regou alguma coisa hoje? Devia. Acalma."],reward:{money:120,items:["caldo","pao_queijo"]}},lider_faisca:{id:"lider_faisca",region:"b2",type:"festeiro",level:3,gelo:88,likes:["musica","festas"],dislikes:["carreira","livros"],open:!0,boss:{burst:{every:3,power:13,name:"Refrão",line:"A Faísca puxa o refrão e a casa INTEIRA canta junto! Você some no meio da cantoria!",def:"humor"}},moves:{zoeira:4,mudar:3,teste:2,celular:1},lines:{intro:"Ô, ô, ô! Microfone na mão e coragem no peito! Vem, que a roda é tua!",win:'Ela gargalha, de verdade, até chorar. "Tu me pegou! Tu me pegou!"',lose:'"Vai treinar o gingado, meu bem. A pista te espera!"',moves:{zoeira:['"Essa camisa aí é de que bloco? Bloco dos esquecidos?"','"Gente, palmas pro corajoso! Ou pro perdido, não sei ainda!"'],mudar:['"Ai, chato. Bora falar de samba!"'],teste:['"Canta um verso aí. Qualquer um. Vai. Tô esperando."']}},hello:["AÊÊÊ! Olha quem chegou na minha casa!","Sabe qual é a regra do Selo Samba? Simples: me fazer rir. Mas rir de VERDADE. Não aquele risinho de educação.","Ah, e a cada três rodadas eu puxo o refrão. Segura firme, que a casa canta junto."],ready:"Bora sambar na conversa?",winTalk:["Ai, ai... fazia tempo que eu não ria assim.","Toma, o Selo Samba. Tu mereceu, de coração.","Próximo é o Campus Sul. A Profa. Celina... boa sorte. Ela não ri. NUNCA. Eu já tentei."],loseTalk:"Faltou molho! Volta que a roda não acaba nunca.",after:["Volta sexta! Tem roda até de manhã!","Ô, minha estrela do Circuito! Chega mais!"],reward:{money:160,items:["sanduiche","caldo"]}},lider_celina:{id:"lider_celina",region:"b3",type:"intelectual",level:3,gelo:104,likes:["livros","carreira"],dislikes:["festas","futebol"],boss:{resist:"humor",resistLine:'A Profa. Celina não esboça reação. "Humor não é argumento. Próximo."',burst:{every:4,power:14,name:"Pergunta de banca",line:'Ela ajeita os óculos: "E qual é a sua fonte?" Você sente o chão sumir.',def:"career"}},moves:{pergunta:5,teste:3,silencio:2},lines:{intro:"Tese, antítese, síntese. Você tem dez minutos. Comece.",win:'Ela fecha o caderno. "...Bem argumentado. Muito bem argumentado."',lose:'"Insuficiente. Revise e volte."',moves:{pergunta:[`"Defina 'sucesso'. Sem usar a palavra 'feliz'."`,'"Isso é uma opinião ou um fato? Explique a diferença."'],teste:['"Você leu isso ou viu num vídeo?"'],silencio:["(Ela espera. Ela tem todo o tempo do mundo. Você não.)"]}},hello:["Boa tarde. Sente-se. Ou não. A cadeira é opcional, o raciocínio não.","O Selo Tese é para quem sabe construir um argumento. Não para quem sabe fazer graça.","Aviso: piada comigo não funciona. Fale do que você construiu."],ready:"Está preparado para a defesa?",winTalk:["Aprovado. Com distinção, inclusive.","O Selo Tese é seu. Use com responsabilidade.","A próxima anfitriã... anfitrião. O Rocha, na Vila Olímpica. Ele grita. Argumente mais alto."],loseTalk:"Sua tese tem furos. Volte com mais fundamento.",after:["Estou escrevendo um artigo sobre o Circuito. Você é a nota de rodapé número 4. É um elogio.","Leia alguma coisa. Qualquer coisa. Depois me conte."],reward:{money:200,items:["sanduiche","cartao"]}},lider_rocha:{id:"lider_rocha",region:"b4",type:"atleta",level:4,gelo:100,likes:["treino","futebol"],dislikes:["livros","arte"],boss:{burst:{every:3,power:15,name:"GRITO DO TÉCNICO",line:'"MAIS UMA! MAIS UMA! QUEM DESISTE NÃO MERECE O SELO!" O grito bate no seu peito.',def:"confidence"},frenzy:!0},moves:{provocar:3,teste:3,zoeira:2,celular:1},lines:{intro:"AQUECIMENTO ACABOU! É JOGO! MOSTRA SERVIÇO!",win:'Ele para. Respira. E sorri, pela primeira vez. "...É ISSO, CARALHO. Desculpa. É ISSO!"',lose:'"PRO BANCO! PENSA NO QUE FEZ!"',moves:{provocar:['"VOCÊ TÁ CANSADO? CANSAÇO É DESCULPA!"','"MOLE! MUITO MOLE!"'],teste:['"Quantas flexões você faz? Fala a verdade!"'],zoeira:['"Esse tênis aí é de corrida ou de shopping?"']}},hello:["NOVATO! Chega mais! Postura!","O Selo Raça é pra quem não desiste. Trinta anos treinando campeão, e sabe o que todos têm em comum? NÃO DESISTEM!","A cada três rodadas eu grito. E se você me encurralar, eu falo mais. Muito mais. Aguenta?"],ready:"TÁ PRONTO OU VAI AQUECER MAIS?",winTalk:["...Respeito. Respeito de verdade.","Toma o Selo Raça. Pendura no pescoço e lembra: dor passa, desistência fica.","Próximo é o Alto da Colina. O Rafael é... sensível. NÃO GRITA COM ELE. Sério."],loseTalk:"VOLTA AMANHÃ! E DEPOIS DE AMANHÃ! ATÉ GANHAR!",after:["BOM DIA, CAMPEÃO! JÁ CORREU HOJE?","Meu filho perguntou de você. Eu disse que você é dos bons. Não conta pra ninguém."],reward:{money:240,items:["acai","sanduiche"]}},lider_rafael:{id:"lider_rafael",region:"b5",type:"romantico",level:4,gelo:104,likes:["arte","musica","livros"],dislikes:["carreira","futebol"],open:!0,boss:{phase:{at:.5,type:"exigente",line:'O Rafael joga o pincel no chão. "Não! Não, não, não. Está tudo errado. TUDO!" Ele entrou em crise criativa!',moves:{teste:4,pergunta:3,ignorar:2}}},moves:{pergunta:3,teste:3,silencio:2},lines:{intro:"Você tem uma luz interessante. Fique aí. Não, ali. Isso. Agora fale.",win:'Ele larga tudo e te olha como quem acabou de ver uma pintura pronta. "Você... é a pintura."',lose:'"Hm. Não. Você ainda não é obra. É rascunho."',moves:{pergunta:['"O que você sente quando vê o pôr do sol? Não pensa. Sente."','"Qual foi a última coisa que te fez chorar?"'],teste:['"Isso foi sincero ou foi educado? Eu sei a diferença."'],silencio:["(Ele te observa em silêncio, segurando o pincel no ar.)"]}},hello:["Shhh. A luz está perfeita. Não estrague.","O Selo Musa não se conquista. Ele acontece. Quando alguém me inspira, eu sei.","Mas cuidado: às vezes eu entro em crise. E na crise eu fico... difícil."],ready:"Quer posar pra mim? Quer dizer... conversar?",winTalk:["Isso foi... inspirador. Faz seis anos que eu pinto o mesmo pôr do sol. Agora sei o que faltava.","O Selo Musa. Leve. É seu.","O próximo é o Distrito Neon. A Pixel. Ela parece frágil, mas ao vivo... ao vivo ela é outra."],loseTalk:"Ainda não. Mas volte. Os rascunhos me interessam.",after:["Pintei você. Não vou mostrar. Ainda.","A luz de hoje está igual àquela tarde. Você lembra?"],reward:{money:280,items:["flores","acai"]}},lider_pixel:{id:"lider_pixel",region:"b6",type:"timido",level:5,gelo:100,likes:["games","cinema"],dislikes:["festas","carreira"],boss:{phase:{at:.5,type:"festeiro",line:'A Pixel aperta um botão. "AO VIVO" acende. Ela vira OUTRA pessoa: "FALA, CHAT! OLHA QUEM TÁ AQUI!"',moves:{zoeira:4,mudar:2,celular:3}},regen:3,regenLine:"O chat manda uma chuva de corações. A Pixel ganha energia."},moves:{silencio:4,celular:4,mudar:2},lines:{intro:"...Oi. Eu... é... (Ela olha pra câmera desligada.) A gente pode... conversar baixinho?",win:'Ela desliga a câmera, devagar. "...Você falou comigo. Não com a Pixel. Comigo. Obrigada."',lose:'"GG! O chat te mandou um F."',moves:{silencio:["(Ela olha pro chão. Depois pra tela. Depois pro chão.)"],celular:["(Ela confere os comentários no celular. 347 novos.)","(Ela responde o chat enquanto você fala.)"],zoeira:['"CHAT, OLHA ESSA CARA! Kkkkkk!"','"Ele achou que ia ganhar da Pixel AO VIVO!"'],mudar:['"Bora falar do novo patch? Não? Ah."']}},hello:["(Ela tira um fone.) ...Oi. Você é... do Circuito?","Eu sou... a Pixel. A anfitriã. Eu sei, eu não pareço.","Fora da live eu... não sou muito boa nisso. Mas se a live ligar... aí eu sou imbatível. Desculpa antecipada."],ready:"...Quer tentar? (Ela respira fundo.)",winTalk:["...Ninguém nunca passou pela fase dois.","(Ela te entrega o Selo Pixel com as duas mãos.) Toma. Você
